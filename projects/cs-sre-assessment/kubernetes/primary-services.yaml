apiVersion: v1
kind: Service
metadata:
  name: app-a-service
spec:
  type: LoadBalancer
  selector:
    app: app-a
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: app-b-service
spec:
  type: LoadBalancer
  selector:
    app: app-b
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080